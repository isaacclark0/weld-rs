[package]
name = "exchange-ops"
version = "0.1.1"
edition = "2024"


[dependencies]
axum = "0.8.4"
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }
diesel = { workspace = true }
dotenvy = "0.15.7"
askama = "0.14.0"
tower-http = { version = "0.6.6", features = ["fs", "compression-gzip"] }
serde = { workspace = true }
async-trait = { workspace = true }
chrono = "0.4.41"
rs-auth-core = { workspace = true }
rs-auth-mysql = { workspace = true }
rs-auth-axum = { workspace = true }
axum-extra = { workspace = true, features = ["cookie-signed"] }
diesel_migrations = { version = "2.2", features = ["mysql"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }
url = { workspace = true }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
todo = "warn"

[workspace]
members = [
    ".",
    "crates/rs-auth/auth",
    "crates/rs-auth/core",
    "crates/rs-auth/mysql",
    "crates/rs-auth/axum",
]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Exchange-Ops contributors"]
repository = "https://github.com/rs-auth/rs-auth"
homepage = "https://rs-auth.com"
keywords = ["authentication", "auth", "axum", "session", "mariadb"]
categories = ["web-programming::http-server", "authentication"]
readme = "crates/rs-auth/README.md"

[workspace.dependencies]
rs-auth-core = { path = "crates/rs-auth/core", version = "0.1.2" }
rs-auth-mysql = { path = "crates/rs-auth/mysql", version = "0.1.2" }
rs-auth-axum = { path = "crates/rs-auth/axum", version = "0.1.2" }

tokio = { version = "1", default-features = false }
async-trait = "0.1"
axum-lib = { package = "axum", version = "0.8", default-features = false }
axum-extra = { version = "0.10", default-features = false }
tower = { version = "0.5", default-features = false }
tower-layer = "0.3"
tower-service = "0.3"
diesel = { version = "2.2", default-features = false, features = ["mysql", "r2d2", "chrono"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
oauth2 = { version = "5", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
url = "2"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/tailwind.css" />
    <script src="/static/htmx.min.js"></script>
    <title>Exchange-Ops</title>
  </head>
  <body class="min-h-screen bg-gray-100 px-4 py-10 text-gray-800">
    <main class="mx-auto w-full max-w-xl">
      <header class="mb-6 flex items-center justify-between rounded-lg bg-white p-5 shadow">
        <div>
          <h1 class="text-xl font-bold">Exchange-Ops</h1>
        </div>
        <form method="post" action="/signout">
          <button type="submit" class="rounded border border-gray-300 px-3 py-2 text-sm font-medium hover:bg-gray-50">Sign out</button>
        </form>
      </header>

      <section class="rounded-lg bg-white p-6 shadow">
        <h2 class="text-lg font-semibold">Invite someone</h2>
        <p class="mt-1 mb-5 text-sm text-gray-600">We’ll email them a link to create an account.</p>
        <form hx-post="/invites" hx-target="#invite-result" hx-swap="innerHTML" hx-on::after-request="if(event.detail.successful) this.reset()" class="space-y-4">
          <div>
            <label for="invite-email" class="mb-1 block text-sm font-semibold">Email address</label>
            <input type="email" id="invite-email" name="email" required autocomplete="email" placeholder="name@example.com" class="w-full rounded border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
          </div>
          <button type="submit" class="rounded bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700">Send invite</button>
          <div id="invite-result" aria-live="polite"></div>
        </form>
      </section>

      <section class="mt-6 rounded-lg bg-white p-6 shadow">
        <h2 class="text-lg font-semibold">Signed in as</h2>
        <p class="mt-3 font-medium">{{ username }}</p>
        <p class="mt-1 text-sm text-gray-600">{{ email }}</p>
        <p class="mt-3 text-sm text-gray-500">Email status: {% if email_verified %}Verified{% else %}Not verified{% endif %}</p>
      </section>
    </main>
  </body>
</html>
